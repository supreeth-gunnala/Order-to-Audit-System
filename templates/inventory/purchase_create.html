{% extends 'base.html' %}

{% block title %}Record Inward Purchase Receipt{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-7">
        <div class="card shadow-sm">
            <div class="card-header bg-white py-3">
                <h5 class="fw-bold mb-1"><i class="bi bi-cart-plus me-2 text-primary"></i>Record Inward Purchase Receipt</h5>
                <p class="text-muted small mb-0">Atomically adds stock to inventory ledger and re-calculates the material's Weighted Average Cost (WAC).</p>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="row g-3 mb-3">
                        <div class="col-12 col-sm-6">
                            <label class="form-label small fw-semibold">Supplier Vendor</label>
                            <select name="supplier" class="form-select" required>
                                {% for s in suppliers %}
                                <option value="{{ s.id }}">{{ s.name }} ({{ s.state }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-12 col-sm-6">
                            <label class="form-label small fw-semibold">Receipt Date</label>
                            <input type="date" name="purchase_date" class="form-control" value="{% now 'Y-m-d' %}" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-12 col-sm-6">
                            <label class="form-label small fw-semibold">Supplier Bill / Invoice No</label>
                            <input type="text" name="supplier_invoice_no" class="form-control" placeholder="e.g. BILL-8890" required>
                        </div>
                        <div class="col-12 col-sm-6">
                            <label class="form-label small fw-semibold">Material Item</label>
                            <select name="item" class="form-select" required>
                                {% for itm in items %}
                                <option value="{{ itm.id }}">{{ itm.name }} [{{ itm.uom.code }}] - Current WAC: ₹{{ itm.weighted_avg_cost|floatformat:2 }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-12 col-sm-6">
                            <label class="form-label small fw-semibold">Quantity Received</label>
                            <input type="number" step="0.001" name="quantity" class="form-control" placeholder="e.g. 60" required>
                        </div>
                        <div class="col-12 col-sm-6">
                            <label class="form-label small fw-semibold">Purchase Rate / Unit (₹)</label>
                            <input type="number" step="0.01" name="unit_price" class="form-control" placeholder="e.g. 45.00" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-semibold">Purchase Notes</label>
                        <textarea name="notes" class="form-control" rows="2" placeholder="Quality check / batch comments..."></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{% url 'inventory:purchase_list' %}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check2-circle me-1"></i> Post Inward Receipt
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
